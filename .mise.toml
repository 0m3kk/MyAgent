[tools]
go = "1.27.3"
node = "26.12.1"
pnpm = "12.16.1"
"go:github.com/golangci/golines" = "0.16.0"

[tasks.help]
description = "List available tasks"
run = "mise tasks"

[tasks.deps]
description = "Install UI dependencies"
run = "cd ui && pnpm install"

[tasks.dev]
description = "Start the Go core and Vite with hot reload"
run = "./scripts/dev.sh"

[tasks.ui]
description = "Build the production UI"
run = "cd ui && pnpm run build"

[tasks.api]
description = "Build agentd and agentctl into bin/"
run = """
mkdir -p bin
go build -o bin/agentd ./cmd/agentd
go build -o bin/agentctl ./cmd/agentctl
"""

[tasks.build]
description = "Build UI and Go binaries"
depends = ["ui", "api"]

[tasks.format]
description = "Format Go code with gofmt and golines"
run = """
gofmt -w $(find cmd internal -name '*.go' -type f)
golines -w --max-len=100 cmd internal
"""

[tasks.format-check]
description = "Check Go formatting without writing"
run = """
files="$(gofmt -l $(find cmd internal -name '*.go' -type f))"
files="$files$(golines -l --max-len=100 cmd internal)"
if [ -n "$files" ]; then
  echo "Unformatted Go files:"
  echo "$files"
  exit 1
fi
"""

[tasks.test]
description = "Run Go tests and the UI typecheck"
run = """
go test ./...
cd ui && pnpm run typecheck
"""

[tasks.e2e]
description = "Run Playwright smoke tests"
run = "cd ui && pnpm exec playwright test"

[tasks.app]
description = "Build the native MyAgent.app bundle"
run = "./scripts/build-macos.sh"

[tasks.install]
description = "Build and install MyAgent.app into /Applications"
depends = ["app"]
run = "./scripts/install-local.sh"

[tasks.sign-setup]
description = "Create a local self-signed code signing identity"
run = "./scripts/setup-signing.sh create"

[tasks.sign-import]
description = "Import a self-signed code signing identity from a .p12"
run = "./scripts/setup-signing.sh import"

[tasks.sign-status]
description = "Show the local code signing identity"
run = "./scripts/setup-signing.sh status"

[tasks.release]
description = "Build and package a macOS release zip"
run = "./scripts/release.sh"

[tasks.sparkle-key]
description = "Print the Sparkle EdDSA public key"
run = "./scripts/sparkle-key.sh public"

[tasks.sparkle-export]
description = "Export the Sparkle private key for GitHub Actions"
run = "./scripts/sparkle-key.sh export"

[tasks.sparkle-import]
description = "Import the Sparkle private key from a file"
run = "./scripts/sparkle-key.sh import"

[tasks.run]
description = "Run the production build locally"
depends = ["build"]
run = '''
MYAGENT_DEV=1 \
MYAGENT_DATA_DIR="${MYAGENT_DATA_DIR:-$PWD/.data}" \
MYAGENT_WORKSPACE="${MYAGENT_WORKSPACE:-$PWD/.data/workspace}" \
./bin/agentd -addr 127.0.0.1:8787 -open=true -ui ui/dist
'''

[tasks.clean]
description = "Remove build output and local data (keeps dist/signing)"
run = "rm -rf bin dist/MyAgent.app dist/release ui/dist .data"
