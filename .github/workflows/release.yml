name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  macos:
    name: Build and publish macOS release
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Go and Node
        uses: jdx/mise-action@v5

      - name: Verify release branch
        if: github.event_name == 'workflow_dispatch' && github.ref_name != github.event.repository.default_branch
        run: |
          echo "Dispatch releases from ${{ github.event.repository.default_branch }}, not ${{ github.ref_name }}." >&2
          exit 1

      - name: Bump version
        id: bump
        if: github.event_name == 'workflow_dispatch'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          VERSION="$(./scripts/bump-version.sh "$BUMP")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Optional: sign CI builds with the same self-signed identity as local
      # builds. Without these secrets the release falls back to ad-hoc signing.
      - name: Import self-signed signing identity
        timeout-minutes: 10
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "MACOS_CERT_P12 is not set; building an ad-hoc signed release."
            exit 0
          fi
          if [ -z "$MACOS_CERT_PASSWORD" ]; then
            echo "MACOS_CERT_PASSWORD is required with MACOS_CERT_P12." >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            "$HOME/Library/Keychains/login.keychain-db" \
            /Library/Keychains/System.keychain \
            /System/Library/Keychains/SystemRootCertificates.keychain
          security default-keychain -d user -s "$KEYCHAIN"
          printf '%s' "$MACOS_CERT_P12" | base64 -D > "$RUNNER_TEMP/MyAgent-SelfSigned.p12"
          SIGNING_KEYCHAIN="$KEYCHAIN" \
          SIGN_P12_PASSWORD="$MACOS_CERT_PASSWORD" \
          SIGN_KEYCHAIN_PASSWORD=actions \
          SIGN_TRUST_SYSTEM=1 \
            ./scripts/setup-signing.sh import "$RUNNER_TEMP/MyAgent-SelfSigned.p12"

      # SPARKLE_PRIVATE_KEY signs the update archive and appcast with EdDSA.
      - name: Build release
        env:
          VERSION: ${{ steps.bump.outputs.version || github.ref_name }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: mise run release

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MyAgent-macOS
          path: dist/release/*
          if-no-files-found: error

      - name: Commit version bump and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION cmd/agentd/main.go app/Info.plist ui/package.json
          if git diff --cached --quiet; then
            echo "Version files are already at ${VERSION}."
          else
            git commit -m "Release v${VERSION}"
          fi
          git tag "v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${VERSION}"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.tag || github.ref_name }}
          name: ${{ steps.bump.outputs.tag || github.ref_name }}
          files: dist/release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
