<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>MyAgent</title>
    <meta name="description" content="A desktop agent that builds tools and workflows, runs them, and improves from real runs." />
    <script>
      try {
        const scale = localStorage.getItem('myagent_font_scale')
        if (scale) document.documentElement.style.setProperty('--font-scale', scale)
        const mode = localStorage.getItem('myagent_theme') || 'system'
        const dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
